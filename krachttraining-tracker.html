<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Vrijdag · Krachttraining</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --forest: #2D4A3A;
    --forest-dark: #1F3528;
    --paper: #F5F0E6;
    --ink: #1A1F1B;
    --muted: #7A7568;
    --border: #E5DFD2;
    --copper: #B8704A;
    --card: #FBF8F1;
    --card-done: #F0EBE0;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: var(--paper);
    color: var(--ink);
    font-family: 'DM Sans', system-ui, -apple-system, sans-serif;
    padding: 24px 16px;
    background-image:
      radial-gradient(circle at 20% 0%, rgba(45, 74, 58, 0.04) 0%, transparent 50%),
      radial-gradient(circle at 80% 100%, rgba(184, 112, 74, 0.04) 0%, transparent 50%);
  }
  input[type="number"]::-webkit-outer-spin-button,
  input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  input[type="number"] { -moz-appearance: textfield; }

  .container { max-width: 640px; margin: 0 auto; }
  .header { margin-bottom: 24px; }
  .header-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
  .eyebrow { font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); font-weight: 500; margin-bottom: 6px; }
  .title { font-family: 'Fraunces', serif; font-size: 56px; font-weight: 500; line-height: 0.95; margin: 0; letter-spacing: -0.02em; font-variation-settings: 'opsz' 144; }
  .title-accent { color: var(--copper); }
  .date-tag { font-family: 'Fraunces', serif; font-size: 13px; font-style: italic; color: var(--muted); padding-top: 12px; text-align: right; }

  .flash { background: var(--forest); color: var(--paper); padding: 12px 16px; border-radius: 8px; font-size: 14px; font-weight: 500; margin-bottom: 16px; animation: fadeIn 0.3s ease; }
  .error-flash { background: #B8704A; color: var(--paper); padding: 10px 14px; border-radius: 8px; font-size: 12px; margin-bottom: 16px; }

  .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 14px; }
  .stat-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 14px 10px; text-align: center; }
  .stat-value { font-family: 'Fraunces', serif; font-size: 30px; font-weight: 500; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
  .stat-value.streak { color: var(--copper); }
  .stat-label { font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-top: 6px; font-weight: 500; }

  .cal-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 18px; }
  .month-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .month-nav-btn { background: transparent; border: 1px solid var(--border); border-radius: 8px; width: 34px; height: 34px; font-size: 20px; color: var(--forest); cursor: pointer; font-family: inherit; line-height: 1; transition: all 0.15s ease; display: flex; align-items: center; justify-content: center; padding-bottom: 3px; }
  .month-nav-btn:hover { background: #EFE8D6; }
  .month-title { font-family: 'Fraunces', serif; font-size: 22px; font-weight: 500; margin: 0; text-transform: capitalize; letter-spacing: -0.01em; }
  .month-year { color: var(--muted); font-style: italic; font-weight: 400; }
  .weekdays-row { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 6px; }
  .weekday { text-align: center; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); font-weight: 600; padding: 4px 0; }
  .weekday.friday { color: var(--copper); }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal-cell {
    aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    border: 1px solid transparent; border-radius: 6px; background: transparent; padding: 0;
    position: relative; transition: all 0.15s ease; font-family: inherit; color: var(--ink); gap: 2px;
    cursor: default;
  }
  .cal-cell.friday { background: rgba(184, 112, 74, 0.06); }
  .cal-cell.today { border-color: var(--copper); border-width: 1.5px; }
  .cal-cell.has-session { background: #EAE3D0; cursor: pointer; }
  .cal-cell.has-session:hover { background: #E5DDC9; }
  .cal-cell.selected { background: var(--forest); color: var(--paper); }
  .cal-cell.future { opacity: 0.4; }
  .cal-cell.empty { visibility: hidden; }
  .cal-day-num { font-size: 13px; font-weight: 500; font-variant-numeric: tabular-nums; line-height: 1; }
  .cal-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--forest); }
  .cal-cell.selected .cal-dot { background: var(--paper); }

  .legend { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--border); font-size: 11px; color: var(--muted); }
  .legend-item { display: flex; align-items: center; gap: 6px; }
  .legend-dot { width: 8px; height: 8px; border-radius: 50%; }

  .details-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 18px; margin-top: 12px; animation: slideIn 0.25s ease; }
  .details-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px dashed var(--border); }
  .details-date { font-family: 'Fraunces', serif; font-size: 19px; font-weight: 500; text-transform: capitalize; letter-spacing: -0.01em; }
  .details-meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .close-btn { background: none; border: none; font-size: 24px; color: var(--muted); cursor: pointer; line-height: 1; padding: 0; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; }
  .details-body { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
  .details-row { display: flex; justify-content: space-between; font-size: 13px; gap: 12px; }
  .details-ex-name { color: var(--ink); font-weight: 500; }
  .details-ex-summary { color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; }
  .delete-btn { background: transparent; border: 1px solid var(--border); color: var(--muted); font-size: 12px; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-family: inherit; width: 100%; }

  .today-header { margin-top: 36px; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
  .today-label { font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--copper); font-weight: 500; margin-bottom: 4px; }
  .today-title { font-family: 'Fraunces', serif; font-size: 28px; font-weight: 500; margin: 0; letter-spacing: -0.02em; }

  .progress-wrap { margin-bottom: 14px; }
  .progress-label { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 6px; font-variant-numeric: tabular-nums; }
  .progress-track { height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
  .progress-bar { height: 100%; background: var(--forest); transition: width 0.3s ease; }

  .prefill-note { font-size: 12px; color: var(--copper); font-style: italic; font-family: 'Fraunces', serif; margin-bottom: 16px; padding: 8px 12px; background: rgba(184, 112, 74, 0.08); border-radius: 6px; border: 1px dashed rgba(184, 112, 74, 0.25); }

  .exercise-list { display: flex; flex-direction: column; gap: 14px; }
  .ex-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 18px; transition: all 0.25s ease; }
  .ex-card.done { background: var(--card-done); border-color: #D6CFB9; }
  .ex-header { display: flex; align-items: flex-start; gap: 12px; }
  .ex-number { font-family: 'Fraunces', serif; font-size: 22px; font-weight: 400; color: var(--copper); font-style: italic; line-height: 1; padding-top: 4px; font-variant-numeric: tabular-nums; }
  .ex-name { font-family: 'Fraunces', serif; font-size: 19px; font-weight: 500; margin: 0; line-height: 1.2; letter-spacing: -0.01em; }
  .ex-name.struck { text-decoration: line-through; text-decoration-color: var(--copper); text-decoration-thickness: 1.5px; }
  .ex-target { font-size: 12px; color: var(--muted); margin-top: 3px; letter-spacing: 0.02em; }
  .ex-thumb { width: 78px; height: 60px; border-radius: 8px; background: #FFFFFF; border: 1px solid var(--border); padding: 4px; cursor: pointer; flex-shrink: 0; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; transition: all 0.2s ease; }
  .ex-thumb:hover { background: #EFE8D6; transform: scale(1.03); }
  .ex-thumb img, .ex-thumb svg { max-width: 100%; max-height: 100%; object-fit: contain; }
  .thumb-zoom { position: absolute; bottom: 3px; right: 4px; font-size: 9px; color: var(--muted); background: rgba(245, 240, 230, 0.85); padding: 1px 4px; border-radius: 3px; font-weight: 600; }
  .expand-btn { background: transparent; border: none; color: var(--muted); font-size: 12px; cursor: pointer; padding: 6px 10px; font-family: inherit; transition: color 0.15s ease; flex-shrink: 0; }
  .expand-btn:hover { color: var(--forest); }

  .sets-table { display: flex; flex-direction: column; gap: 6px; margin-top: 14px; }
  .sets-header { display: flex; gap: 8px; font-size: 10px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); padding-bottom: 4px; padding-left: 2px; }
  .sets-header-cell { flex: 1; }
  .set-row { display: flex; gap: 8px; align-items: center; }
  .set-num { width: 28px; font-family: 'Fraunces', serif; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; padding-left: 2px; }
  .input-cell { flex: 1; background: #FFFFFF; border: 1px solid var(--border); border-radius: 6px; transition: all 0.15s ease; }
  .input-cell:focus-within { border-color: var(--forest); background: #FFFFFF; }
  .set-input { width: 100%; border: none; background: transparent; padding: 10px 12px; font-size: 15px; font-family: inherit; color: var(--ink); outline: none; font-variant-numeric: tabular-nums; }
  .check-btn { width: 36px; height: 36px; border: 1px solid var(--border); background: #FFFFFF; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: 600; color: transparent; transition: all 0.15s ease; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .check-btn:hover { transform: scale(1.05); }
  .check-btn.done { background: var(--forest); border-color: var(--forest); color: var(--paper); }

  .save-btn { width: 100%; background: var(--forest); color: var(--paper); border: none; padding: 16px 24px; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 24px; font-family: inherit; transition: all 0.15s ease; letter-spacing: 0.01em; }
  .save-btn:hover:not(:disabled) { background: var(--forest-dark); transform: translateY(-1px); }
  .save-btn:disabled { background: #C8C2B0; cursor: not-allowed; }
  .footnote { font-size: 11px; color: var(--muted); text-align: center; margin-top: 14px; font-style: italic; font-family: 'Fraunces', serif; }

  .bottom-margin { height: 40px; }

  .modal-backdrop { position: fixed; inset: 0; background: rgba(26, 31, 27, 0.65); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 1000; animation: backdropIn 0.2s ease; }
  .modal-content { background: var(--paper); border-radius: 16px; max-width: 480px; width: 100%; max-height: 90vh; overflow-y: auto; position: relative; border: 1px solid var(--border); box-shadow: 0 30px 60px rgba(0,0,0,0.25); animation: modalIn 0.25s cubic-bezier(0.2, 0.9, 0.3, 1); }
  .modal-close { position: absolute; top: 12px; right: 12px; background: rgba(245, 240, 230, 0.9); border: 1px solid var(--border); border-radius: 50%; width: 32px; height: 32px; font-size: 20px; color: var(--ink); cursor: pointer; display: flex; align-items: center; justify-content: center; line-height: 1; padding: 0; z-index: 2; }
  .modal-img-wrap { background: var(--card); padding: 24px; height: 320px; display: flex; align-items: center; justify-content: center; border-top-left-radius: 16px; border-top-right-radius: 16px; border-bottom: 1px solid var(--border); }
  .modal-img-wrap img, .modal-img-wrap svg { max-width: 100%; max-height: 100%; object-fit: contain; }
  .modal-body { padding: 24px 28px 28px; }
  .modal-eyebrow { font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--copper); font-weight: 500; margin-bottom: 6px; }
  .modal-title { font-family: 'Fraunces', serif; font-size: 28px; font-weight: 500; margin: 0 0 14px; letter-spacing: -0.02em; line-height: 1.1; }
  .modal-tip { font-size: 14px; color: var(--ink); line-height: 1.55; margin: 0 0 16px; }
  .edit-img-btn { background: transparent; border: 1px dashed var(--border); color: var(--muted); font-size: 12px; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-family: inherit; width: 100%; margin-bottom: 14px; transition: all 0.15s ease; }
  .url-editor { background: var(--card); padding: 14px; border-radius: 8px; margin-bottom: 14px; border: 1px solid var(--border); }
  .url-editor-label { font-size: 11px; color: var(--muted); margin-bottom: 8px; line-height: 1.4; }
  .url-input { width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 12px; font-family: inherit; background: #FFF; outline: none; margin-bottom: 10px; }
  .url-btns { display: flex; gap: 6px; flex-wrap: wrap; }
  .url-btn-primary { background: var(--forest); color: var(--paper); border: none; padding: 7px 14px; border-radius: 5px; font-size: 12px; font-weight: 600; cursor: pointer; font-family: inherit; }
  .url-btn-secondary { background: transparent; color: var(--muted); border: 1px solid var(--border); padding: 7px 14px; border-radius: 5px; font-size: 12px; cursor: pointer; font-family: inherit; }
  .url-btn-danger { background: transparent; color: var(--copper); border: 1px solid var(--copper); padding: 7px 14px; border-radius: 5px; font-size: 12px; cursor: pointer; font-family: inherit; }
  .modal-target { font-size: 12px; color: var(--muted); padding-top: 14px; border-top: 1px dashed var(--border); font-family: 'Fraunces', serif; font-style: italic; letter-spacing: 0.02em; }

  /* Setup screen */
  .setup-screen { max-width: 560px; margin: 40px auto; background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 32px; }
  .setup-screen h2 { font-family: 'Fraunces', serif; font-size: 26px; font-weight: 500; margin: 0 0 16px; }
  .setup-screen p { font-size: 14px; line-height: 1.6; color: var(--ink); margin: 0 0 12px; }
  .setup-screen ol { padding-left: 22px; font-size: 14px; line-height: 1.7; }
  .setup-screen code { background: #EAE3D0; padding: 2px 6px; border-radius: 4px; font-size: 12px; font-family: 'Courier New', monospace; }
  .setup-screen .note { background: rgba(184, 112, 74, 0.08); border: 1px dashed rgba(184, 112, 74, 0.3); padding: 12px 14px; border-radius: 8px; font-size: 13px; color: var(--ink); margin-top: 16px; }

  /* Loading */
  .loading { text-align: center; padding: 80px 20px; color: var(--muted); font-style: italic; font-family: 'Fraunces', serif; }

  /* Timer UI */
  .timer-cell {
    flex: 1;
    background: #FFFFFF;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 12px;
    display: flex;
    align-items: center;
    gap: 10px;
    position: relative;
    overflow: hidden;
    min-height: 40px;
    transition: border-color 0.2s ease, background 0.2s ease;
  }
  .timer-cell.running { border-color: var(--copper); }
  .timer-cell.complete { background: var(--card-done); border-color: #D6CFB9; }
  .timer-progress {
    position: absolute;
    inset: 0;
    background: rgba(184, 112, 74, 0.13);
    transform-origin: left;
    transform: scaleX(0);
  }
  .timer-cell.running .timer-progress { transition: transform 1s linear; }
  .timer-cell.complete .timer-progress { background: rgba(45, 74, 58, 0.10); transform: scaleX(1); }
  .timer-label {
    position: relative; z-index: 1;
    font-size: 13px;
    color: var(--ink);
    font-weight: 500;
  }
  .timer-countdown {
    position: relative; z-index: 1;
    margin-left: auto;
    font-family: 'Fraunces', serif;
    font-size: 18px;
    color: var(--copper);
    font-variant-numeric: tabular-nums;
    font-weight: 500;
    letter-spacing: -0.01em;
  }
  .timer-cell.complete .timer-countdown { color: var(--forest); }
  .timer-btn {
    width: 36px; height: 36px;
    border: 1px solid var(--border);
    background: #FFFFFF;
    border-radius: 6px;
    cursor: pointer;
    font-size: 11px;
    color: var(--forest);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all 0.15s ease;
    font-family: inherit;
  }
  .timer-btn:hover:not(:disabled) { transform: scale(1.05); }
  .timer-btn.running { background: var(--copper); color: var(--paper); border-color: var(--copper); }
  .timer-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes slideIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes modalIn { from { opacity: 0; transform: scale(0.94); } to { opacity: 1; transform: scale(1); } }
  @keyframes backdropIn { from { opacity: 0; } to { opacity: 1; } }
</style>
</head>
<body>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel" data-presets="env,react">
    // ============================================================

    // ============================================================

    const SUPABASE_ANON_KEY = "sb_publishable_Ro3Gc1NbCWdwx588v7PZ0Q_feAXTg1V";
    // ============================================================

    const { useState, useEffect, useRef } = React;

    const EXERCISES = [
      {
        id: "goblet-squat", name: "Goblet squat", sets: 3, target: "10 reps", isTime: false,
        image: "https://upload.wikimedia.org/wikipedia/commons/thumb/8/8e/Squats.svg/640px-Squats.svg.png",

        image: "https://upload.wikimedia.org/wikipedia/commons/thumb/6/6e/Romanian-deadlift-1.png/620px-Romanian-deadlift-1.png",
        tip: "Knieën licht gebogen — niet meer. Duw je heupen naar achteren alsof je een deur dichtdoet met je kont. Rug recht, gewichten dicht langs je benen."

      {

      },
      {
        id: "hip-thrust", name: "Hip thrust", sets: 3, target: "12 reps", isTime: false,
        image: null,
        tip: "Schouderbladen op de bank, voeten plat op de grond. Knijp je billen aan op het hoogste punt — je lichaam moet één rechte lijn vormen van knie tot schouder."
      },
      {
        id: "calf-raises", name: "Staande calf raises", sets: 3, target: "15 reps", isTime: false,
        image: "https://upload.wikimedia.org/wikipedia/commons/thumb/9/9e/Standing-calf-raises-1.svg/163px-Standing-calf-raises-1.svg.png",
        tip: "Sta op een verhoging zodat je hielen onder horizontaal kunnen zakken. Volledige rek beneden, helemaal door op je tenen omhoog. Rustig tempo."
      },
      {
        id: "plank", name: "Plank + side plank", sets: 3, target: "30s + 2×20s", isTime: true,
        setDurations: [30, 20, 20],
        setLabels: ["Plank", "Side plank links", "Side plank rechts"],
        image: "https://upload.wikimedia.org/wikipedia/commons/thumb/2/2e/Plank_exercise.svg/800px-Plank_exercise.svg.png",
        tip: "Lichaam in een rechte lijn — geen doorgezakte rug, geen hoge billen. Span actief je core en bilspieren. Adem rustig door."
      },
    ];

    const MONTHS_NL = ["januari","februari","maart","april","mei","juni","juli","augustus","september","oktober","november","december"];
    const MONTHS_NL_SHORT = ["jan","feb","mrt","apr","mei","jun","jul","aug","sep","okt","nov","dec"];
    const DAYS_NL = ["zondag","maandag","dinsdag","woensdag","donderdag","vrijdag","zaterdag"];

    const formatDate = (iso) => {
      const d = new Date(iso + "T00:00:00");
      return `${DAYS_NL[d.getDay()]} ${d.getDate()} ${MONTHS_NL_SHORT[d.getMonth()]}`;
    };

    const todayISO = () => {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
    };

    function findLastSets(history, exId) {
      for (const session of history) {
        const sets = session.exercises && session.exercises[exId];
        if (sets && sets.some((s) => s.done && (s.weight || s.reps))) return sets;
      }
      return null;
    }

    function blankSession(history) {
      history = history || [];
      const exercises = {};
      for (const ex of EXERCISES) {
        const last = findLastSets(history, ex.id);
        exercises[ex.id] = Array.from({ length: ex.sets }, (_, i) => ({
          weight: (last && last[i] && last[i].weight) || "",
          reps:   (last && last[i] && last[i].reps)   || "",
          done: false,
        }));
      }
      return { date: todayISO(), exercises };
    }

    function calculateStreak(history) {
      if (history.length === 0) return 0;
      const dates = [...new Set(history.map((s) => s.date))].sort().reverse();
      const today = new Date(todayISO() + "T00:00:00");
      const mostRecent = new Date(dates[0] + "T00:00:00");
      if (Math.floor((today - mostRecent) / 86400000) > 8) return 0;
      let streak = 1, cursor = mostRecent;
      for (let i = 1; i < dates.length; i++) {
        const next = new Date(dates[i] + "T00:00:00");
        const gap = Math.floor((cursor - next) / 86400000);
        if (gap >= 5 && gap <= 9) { streak++; cursor = next; }
        else if (gap < 5) continue;
        else break;
      }
      return streak;
    }

    function getMonthGrid(year, month) {
      const firstDay = new Date(year, month, 1);
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const startOffset = (firstDay.getDay() + 6) % 7;
      const cells = [];
      for (let i = 0; i < startOffset; i++) cells.push(null);
      for (let d = 1; d <= daysInMonth; d++) cells.push(d);
      while (cells.length % 7 !== 0) cells.push(null);
      return cells;
    }

    function formatTime(secs) {
      if (secs < 60) return `${secs}s`;
      const m = Math.floor(secs / 60);
      const s = secs % 60;
      return `${m}:${String(s).padStart(2, "0")}`;
    }

    function playTimerEnd() {
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        const ctx = new AC();
        [880, 1320].forEach((freq, i) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain); gain.connect(ctx.destination);
          osc.type = "sine";
          osc.frequency.value = freq;
          const start = ctx.currentTime + i * 0.18;
          gain.gain.setValueAtTime(0.0001, start);
          gain.gain.exponentialRampToValueAtTime(0.25, start + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.3);
          osc.start(start);
          osc.stop(start + 0.32);
        });
      } catch (e) {}
      try { if (navigator.vibrate) navigator.vibrate([200, 100, 300]); } catch (e) {}
    }

    function ExerciseImage({ ex, customImage }) {
      const [errored, setErrored] = useState(false);
      const src = customImage || ex.image;
      if (!src || errored) return <FallbackIllustration id={ex.id} />;

    // ============================================================
    // SETUP SCREEN — shown when Supabase isn't configured
    // ============================================================
    function SetupScreen() {
      return (
        <div className="setup-screen">
          <div className="eyebrow">Eenmalige setup</div>

            <li>Open dit HTML-bestand in een editor en plak ze in de regels:
              <br /><code>const SUPABASE_URL = "..."</code>

    // ============================================================
    // MAIN APP
    // ============================================================
    function App() {
      const dbRef = useRef(null);
      const [history, setHistory] = useState([]);
      const [current, setCurrent] = useState(() => blankSession([]));
      const [customImages, setCustomImages] = useState({});
      const [loaded, setLoaded] = useState(false);
      const [error, setError] = useState(null);
      const [savedFlash, setSavedFlash] = useState(false);
      const [syncError, setSyncError] = useState(null);
      const [enlargedExercise, setEnlargedExercise] = useState(null);
      const [editingImage, setEditingImage] = useState(null);
      const [imageUrlInput, setImageUrlInput] = useState("");
      const [manuallyExpanded, setManuallyExpanded] = useState({});
      const [timers, setTimers] = useState({}); // { "exId|setIdx": { remaining, total } }

      const now = new Date();
      const [calYear, setCalYear] = useState(now.getFullYear());
      const [calMonth, setCalMonth] = useState(now.getMonth());
      const [selectedDate, setSelectedDate] = useState(null);

      // Initialize Supabase client
      useEffect(() => {
        try {
          dbRef.current = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        } catch (e) {
          setError("Kon niet verbinden met Supabase: " + e.message);
          setLoaded(true);
          return;
        }
        loadInitialData();
      }, []);

      async function loadInitialData() {
        try {
          const db = dbRef.current;
          const [sessionsRes, prefsRes] = await Promise.all([
            db.from("sessions").select("*").order("session_date", { ascending: false }),
            db.from("preferences").select("*").in("key", ["current_session", "custom_images"]),
          ]);
          if (sessionsRes.error) throw sessionsRes.error;
          if (prefsRes.error) throw prefsRes.error;

          const loadedHistory = (sessionsRes.data || []).map((row) => row.data);
          const prefs = {};
          for (const row of (prefsRes.data || [])) prefs[row.key] = row.value;

          setHistory(loadedHistory);
          setCustomImages(prefs.custom_images || {});
          if (prefs.current_session && prefs.current_session.date === todayISO()) {
            setCurrent(prefs.current_session);
          } else {
            setCurrent(blankSession(loadedHistory));
          }
        } catch (e) {
          setError("Fout bij laden: " + (e.message || e));
        } finally {
          setLoaded(true);
        }
      }

      // Debounced save of current session (waits 600ms after last edit)
      useEffect(() => {
        if (!loaded) return;
        const t = setTimeout(async () => {
          try {
            const db = dbRef.current;
            const { error } = await db.from("preferences").upsert({
              key: "current_session",
              value: current,
              updated_at: new Date().toISOString(),
            });
            if (error) throw error;
            setSyncError(null);
          } catch (e) {
            setSyncError("Synchronisatie mislukt — wijzigingen zijn lokaal bewaard.");
          }
        }, 600);
        return () => clearTimeout(t);
      }, [current, loaded]);

      // Save custom images immediately on change
      useEffect(() => {
        if (!loaded) return;
        (async () => {
          try {
            await dbRef.current.from("preferences").upsert({
              key: "custom_images",
              value: customImages,
              updated_at: new Date().toISOString(),
            });
          } catch (e) {
            setSyncError("Afbeeldingen niet opgeslagen — probeer opnieuw.");
          }
        })();
      }, [customImages, loaded]);

      const updateSet = (exId, idx, field, value) => {
        setCurrent((prev) => ({
          ...prev,
          exercises: { ...prev.exercises, [exId]: prev.exercises[exId].map((s, i) => i === idx ? { ...s, [field]: value } : s) },
        }));
      };

      const toggleDone = (exId, idx) => {
        setCurrent((prev) => ({
          ...prev,
          exercises: { ...prev.exercises, [exId]: prev.exercises[exId].map((s, i) => i === idx ? { ...s, done: !s.done } : s) },
        }));
        setManuallyExpanded((prev) => {
          const next = { ...prev };
          delete next[exId];
          return next;
        });
        // Stop a running timer for this set, if any
        const key = `${exId}|${idx}`;
        setTimers((prev) => {
          if (!prev[key]) return prev;
          const n = { ...prev };
          delete n[key];
          return n;
        });
      };

      const startTimer = (exId, idx, duration) => {
        const key = `${exId}|${idx}`;
        setTimers((prev) => ({ ...prev, [key]: { remaining: duration, total: duration } }));
      };

      const stopTimer = (exId, idx) => {
        const key = `${exId}|${idx}`;
        setTimers((prev) => {
          const n = { ...prev };
          delete n[key];
          return n;
        });
      };

      // Timer tick — runs every second while any timer is active
      const hasActiveTimers = Object.keys(timers).length > 0;
      useEffect(() => {
        if (!hasActiveTimers) return;
        const interval = setInterval(() => {
          setTimers((prev) => {
            const next = { ...prev };
            const finished = [];
            for (const key of Object.keys(next)) {
              if (next[key].remaining > 0) {
                const newRem = next[key].remaining - 1;
                next[key] = { ...next[key], remaining: newRem };
                if (newRem === 0) finished.push({ key, total: next[key].total });
              }
            }
            if (finished.length > 0) {
              setTimeout(() => {
                playTimerEnd();
                for (const f of finished) {
                  const [exId, idxStr] = f.key.split("|");
                  const idx = parseInt(idxStr, 10);
                  setCurrent((cur) => ({
                    ...cur,
                    exercises: {
                      ...cur.exercises,
                      [exId]: cur.exercises[exId].map((s, i) =>
                        i === idx ? { ...s, reps: `${f.total}s`, done: true } : s
                      ),
                    },
                  }));
                  setManuallyExpanded((m) => { const n = { ...m }; delete n[exId]; return n; });
                }
                setTimers((t) => {
                  const n = { ...t };
                  for (const f of finished) delete n[f.key];
                  return n;
                });
              }, 0);
            }
            return next;
          });
        }, 1000);
        return () => clearInterval(interval);
      }, [hasActiveTimers]);

      const finishSession = async () => {
        const completed = { ...current, completedAt: new Date().toISOString() };
        try {
          const db = dbRef.current;
          const { error: e1 } = await db.from("sessions").upsert({
            session_date: completed.date,
            data: completed,
            completed_at: completed.completedAt,
          }, { onConflict: "session_date" });
          if (e1) throw e1;
          // Clear current_session preference
          await db.from("preferences").delete().eq("key", "current_session");
          const newHistory = [completed, ...history.filter((s) => s.date !== completed.date)];
          newHistory.sort((a, b) => b.date.localeCompare(a.date));
          setHistory(newHistory);
          setCurrent(blankSession(newHistory));
          setManuallyExpanded({});
          setSavedFlash(true);
          setTimeout(() => setSavedFlash(false), 2500);
          window.scrollTo({ top: 0, behavior: "smooth" });
        } catch (e) {
          setSyncError("Sessie afronden mislukt: " + (e.message || e));
        }
      };

      const deleteSession = async (date) => {
        try {
          await dbRef.current.from("sessions").delete().eq("session_date", date);
          setHistory((prev) => prev.filter((s) => s.date !== date));
          setSelectedDate(null);
        } catch (e) {
          setSyncError("Verwijderen mislukt.");
        }
      };

      const saveCustomImage = (exId) => {
        const url = imageUrlInput.trim();
        if (url) setCustomImages((prev) => ({ ...prev, [exId]: url }));
        else setCustomImages((prev) => { const n = { ...prev }; delete n[exId]; return n; });
        setEditingImage(null);
        setImageUrlInput("");
      };

      const totalSets = EXERCISES.reduce((s, e) => s + e.sets, 0);
      const doneSets = Object.values(current.exercises).reduce((sum, sets) => sum + sets.filter((s) => s.done).length, 0);
      const progress = totalSets > 0 ? (doneSets / totalSets) * 100 : 0;

      const sessionsByDate = history.reduce((acc, s) => { acc[s.date] = s; return acc; }, {});
      const stats = {
        total: history.length,
        thisMonth: history.filter((s) => {
          const d = new Date(s.date + "T00:00:00");
          return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth();
        }).length,
        streak: calculateStreak(history),
      };

      const navMonth = (delta) => {
        let m = calMonth + delta, y = calYear;
        if (m < 0) { m = 11; y--; }
        if (m > 11) { m = 0; y++; }
        setCalMonth(m); setCalYear(y); setSelectedDate(null);
      };

      const cells = getMonthGrid(calYear, calMonth);
      const selectedSession = selectedDate ? sessionsByDate[selectedDate] : null;

      if (!loaded) return <div className="loading">Bezig met laden…</div>;
      if (error) {
        return (
          <div className="container">
            <div style={{ background: "#FBF8F1", border: "1px solid #E5DFD2", borderRadius: 12, padding: 24, marginTop: 40 }}>
              <h3 style={{ fontFamily: "'Fraunces', serif", margin: "0 0 8px" }}>Verbinding met Supabase mislukt</h3>
              <p style={{ fontSize: 13, color: "#7A7568", margin: "0 0 12px" }}>{error}</p>
              <p style={{ fontSize: 13, color: "#7A7568", margin: 0 }}>
                Controleer of <code>SUPABASE_URL</code> en <code>SUPABASE_ANON_KEY</code> bovenaan dit bestand correct zijn ingevuld,
                en of je het SQL-script in Supabase hebt uitgevoerd.
              </p>
            </div>
          </div>
        );
      }

      return (
        <div className="container">
          <header className="header">
            <div className="header-top">
              <div>
                <div className="eyebrow">Logboek · Krachttraining</div>
                <h1 className="title">Vrijdag<span className="title-accent">.</span></h1>
              </div>
              <div className="date-tag">{formatDate(todayISO())}</div>
            </div>
          </header>

          {savedFlash && <div className="flash">✓ Sessie opgeslagen. Goed bezig.</div>}
          {syncError && <div className="error-flash">{syncError}</div>}

          <div className="stats-row">
            <div className="stat-card">
              <div className="stat-value">{stats.total}</div>
              <div className="stat-label">{stats.total === 1 ? "Sessie" : "Sessies"}</div>
            </div>
            <div className="stat-card">
              <div className="stat-value">{stats.thisMonth}</div>
              <div className="stat-label">Deze maand</div>
            </div>
            <div className="stat-card">
              <div className={"stat-value" + (stats.streak > 0 ? " streak" : "")}>{stats.streak}</div>
              <div className="stat-label">{stats.streak === 1 ? "Week op rij" : "Weken op rij"}</div>
            </div>
          </div>

          <div className="cal-card">
            <div className="month-nav">
              <button className="month-nav-btn" onClick={() => navMonth(-1)} aria-label="Vorige maand">‹</button>
              <h3 className="month-title">{MONTHS_NL[calMonth]} <span className="month-year">{calYear}</span></h3>
              <button className="month-nav-btn" onClick={() => navMonth(1)} aria-label="Volgende maand">›</button>
            </div>
            <div className="weekdays-row">
              {["ma","di","wo","do","vr","za","zo"].map((d, i) => (
                <div key={i} className={"weekday" + (i === 4 ? " friday" : "")}>{d}</div>
              ))}
            </div>
            <div className="cal-grid">
              {cells.map((day, i) => {
                if (day === null) return <div key={i} className="cal-cell empty" />;
                const dateStr = `${calYear}-${String(calMonth + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
                const session = sessionsByDate[dateStr];
                const isToday = dateStr === todayISO();
                const isFriday = (i % 7) === 4;
                const cellDate = new Date(dateStr + "T00:00:00");
                const isFuture = cellDate > new Date(todayISO() + "T00:00:00");
                const isSelected = selectedDate === dateStr;
                const classes = ["cal-cell"];
                if (isFriday) classes.push("friday");
                if (isToday) classes.push("today");
                if (session) classes.push("has-session");
                if (isSelected) classes.push("selected");
                if (isFuture) classes.push("future");
                return (
                  <button key={i} className={classes.join(" ")}
                    onClick={() => session && setSelectedDate(isSelected ? null : dateStr)}
                    disabled={!session}>
                    <span className="cal-day-num">{day}</span>
                    {session && <div className="cal-dot" />}
                  </button>
                );
              })}
            </div>
            <div className="legend">
              <div className="legend-item"><div className="legend-dot" style={{ background: "#2D4A3A" }} /><span>Voltooid</span></div>
              <div className="legend-item"><div className="legend-dot" style={{ border: "1.5px solid #B8704A", background: "transparent" }} /><span>Vandaag</span></div>
              <div className="legend-item"><div className="legend-dot" style={{ background: "rgba(184, 112, 74, 0.12)" }} /><span>Vrijdag</span></div>
            </div>
          </div>

          {selectedSession && (
            <div className="details-card">
              <div className="details-header">
                <div>
                  <div className="details-date">{formatDate(selectedSession.date)}</div>
                  <div className="details-meta">
                    {Object.values(selectedSession.exercises).reduce((s, sets) => s + sets.filter((x) => x.done).length, 0)} sets voltooid
                  </div>
                </div>
                <button onClick={() => setSelectedDate(null)} className="close-btn" aria-label="Sluiten">×</button>
              </div>
              <div className="details-body">
                {EXERCISES.map((ex) => {
                  const sets = selectedSession.exercises[ex.id] || [];
                  const summary = sets.filter((s) => s.done && (s.weight || s.reps))
                    .map((s) => ex.isTime ? s.reps : `${s.weight || "?"}kg × ${s.reps || "?"}`).join("  ·  ");
                  if (!summary) return null;
                  return (
                    <div key={ex.id} className="details-row">
                      <span className="details-ex-name">{ex.name}</span>
                      <span className="details-ex-summary">{summary}</span>
                    </div>
                  );
                })}
              </div>
              <button onClick={() => deleteSession(selectedSession.date)} className="delete-btn">Verwijder deze sessie</button>
            </div>
          )}

          <div className="today-header">
            <div className="today-label">Vandaag</div>
            <h2 className="today-title">De sessie</h2>
          </div>

          <div className="progress-wrap">
            <div className="progress-label">
              <span>{doneSets} van {totalSets} sets</span>
              <span>{Math.round(progress)}%</span>
            </div>
            <div className="progress-track">
              <div className="progress-bar" style={{ width: `${progress}%` }} />
            </div>
          </div>

          {history.length > 0 && <div className="prefill-note">↻ Waardes van vorige sessie zijn voor je ingevuld. Pas aan waar nodig.</div>}

          <div className="exercise-list">
            {EXERCISES.map((ex, exIdx) => {
              const sets = current.exercises[ex.id];
              const allDone = sets.every((s) => s.done);
              const isCollapsed = allDone && !manuallyExpanded[ex.id];
              return (
                <div key={ex.id} className={"ex-card" + (allDone ? " done" : "")}>
                  <div className="ex-header" style={{ marginBottom: isCollapsed ? 0 : undefined }}>
                    <div className="ex-number">{String(exIdx + 1).padStart(2, "0")}</div>
                    <div style={{ flex: 1 }}>
                      <h3 className={"ex-name" + (allDone ? " struck" : "")}>{ex.name}</h3>
                      <div className="ex-target">{ex.sets} sets × {ex.target}</div>
                    </div>
                    {allDone ? (
                      <button className="expand-btn"
                        onClick={() => setManuallyExpanded((prev) => ({ ...prev, [ex.id]: !prev[ex.id] }))}>
                        {isCollapsed ? "▼" : "▲"}
                      </button>
                    ) : (
                      <button className="ex-thumb" onClick={() => setEnlargedExercise(ex)} aria-label={`${ex.name} vergroten`}>
                        <ExerciseImage ex={ex} customImage={customImages[ex.id]} />
                        <div className="thumb-zoom">⤢</div>
                      </button>
                    )}
                  </div>

                  {!isCollapsed && (
                    <div className="sets-table">
                      <div className="sets-header">
                        <div style={{ width: 28 }}>Set</div>
                        {ex.isTime && ex.setDurations ? (
                          <React.Fragment>
                            <div className="sets-header-cell">Onderdeel · Tijd</div>
                            <div style={{ width: 36 }}></div>
                          </React.Fragment>
                        ) : (
                          <React.Fragment>
                            {!ex.isTime && <div className="sets-header-cell">Gewicht (kg)</div>}
                            <div className="sets-header-cell">{ex.isTime ? "Tijd / notitie" : "Reps"}</div>
                          </React.Fragment>
                        )}
                        <div style={{ width: 36, textAlign: "center" }}>✓</div>
                      </div>
                      {sets.map((set, idx) => {
                        if (ex.isTime && ex.setDurations) {
                          const duration = ex.setDurations[idx];
                          const timer = timers[`${ex.id}|${idx}`];
                          const label = ex.setLabels ? ex.setLabels[idx] : `Set ${idx + 1}`;
                          const isRunning = !!timer;
                          const remaining = isRunning ? timer.remaining : duration;
                          const isComplete = set.done && !isRunning;
                          const progress = isRunning ? 1 - timer.remaining / timer.total : (isComplete ? 1 : 0);
                          return (
                            <div key={idx} className="set-row">
                              <div className="set-num">{idx + 1}</div>
                              <div className={"timer-cell" + (isRunning ? " running" : "") + (isComplete ? " complete" : "")}>
                                <div className="timer-progress" style={{ transform: `scaleX(${progress})` }} />
                                <span className="timer-label">{label}</span>
                                <span className="timer-countdown">{formatTime(remaining)}</span>
                              </div>
                              <button className={"timer-btn" + (isRunning ? " running" : "")}
                                onClick={() => isRunning ? stopTimer(ex.id, idx) : startTimer(ex.id, idx, duration)}
                                disabled={isComplete}
                                aria-label={isRunning ? "Timer stoppen" : "Timer starten"}>
                                {isRunning ? "■" : "▶"}
                              </button>
                              <button onClick={() => toggleDone(ex.id, idx)}
                                className={"check-btn" + (set.done ? " done" : "")} aria-label="Set voltooid">
                                {set.done ? "✓" : ""}
                              </button>
                            </div>
                          );
                        }
                        return (
                          <div key={idx} className="set-row">
                            <div className="set-num">{idx + 1}</div>
                            {!ex.isTime && (
                              <div className="input-cell">
                                <input type="number" inputMode="decimal" step="0.5" value={set.weight}
                                  onChange={(e) => updateSet(ex.id, idx, "weight", e.target.value)}
                                  placeholder="—" className="set-input" />
                              </div>
                            )}
                            <div className="input-cell">
                              <input type={ex.isTime ? "text" : "number"} inputMode={ex.isTime ? "text" : "numeric"}
                                value={set.reps} onChange={(e) => updateSet(ex.id, idx, "reps", e.target.value)}
                                placeholder={ex.isTime ? "30s" : "—"} className="set-input" />
                            </div>
                            <button onClick={() => toggleDone(ex.id, idx)}
                              className={"check-btn" + (set.done ? " done" : "")} aria-label="Set voltooid">
                              {set.done ? "✓" : ""}
                            </button>
                          </div>
                        );
                      })}
                    </div>
                  )}
                </div>
              );
            })}
          </div>

          <button className="save-btn" onClick={finishSession} disabled={doneSets === 0}>
            Sessie afronden →
          </button>
          <div className="footnote">Je voortgang wordt automatisch gesynchroniseerd met Supabase.</div>
          <div className="bottom-margin" />

          {enlargedExercise && (
            <div className="modal-backdrop" onClick={() => { setEnlargedExercise(null); setEditingImage(null); }}>
              <div className="modal-content" onClick={(e) => e.stopPropagation()}>
                <button onClick={() => { setEnlargedExercise(null); setEditingImage(null); }} className="modal-close" aria-label="Sluiten">×</button>
                <div className="modal-img-wrap">
                  <ExerciseImage ex={enlargedExercise} customImage={customImages[enlargedExercise.id]} />
                </div>
                <div className="modal-body">
                  <div className="modal-eyebrow">Techniek</div>
                  <h3 className="modal-title">{enlargedExercise.name}</h3>
                  <p className="modal-tip">{enlargedExercise.tip}</p>

                  {editingImage === enlargedExercise.id ? (
                    <div className="url-editor">
                      <div className="url-editor-label">Plak hier een afbeelding-URL (rechtermuisklik op een plaatje → "Afbeeldingsadres kopiëren"):</div>
                      <input type="text" value={imageUrlInput}
                        onChange={(e) => setImageUrlInput(e.target.value)}
                        placeholder="https://..." className="url-input" />
                      <div className="url-btns">
                        <button onClick={() => saveCustomImage(enlargedExercise.id)} className="url-btn-primary">Opslaan</button>
                        <button onClick={() => { setEditingImage(null); setImageUrlInput(""); }} className="url-btn-secondary">Annuleer</button>
                        {customImages[enlargedExercise.id] && (
                          <button onClick={() => { setImageUrlInput(""); saveCustomImage(enlargedExercise.id); }} className="url-btn-danger">Reset</button>
                        )}
                      </div>
                    </div>
                  ) : (
                    <button onClick={() => { setEditingImage(enlargedExercise.id); setImageUrlInput(customImages[enlargedExercise.id] || ""); }} className="edit-img-btn">
                      ✎ {customImages[enlargedExercise.id] ? "Eigen afbeelding wijzigen" : "Eigen afbeelding toevoegen"}
                    </button>
                  )}

                  <div className="modal-target">{enlargedExercise.sets} sets × {enlargedExercise.target}</div>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ============================================================
    // BOOT
    // ============================================================
    const root = ReactDOM.createRoot(document.getElementById("root"));
    if (!SUPABASE_URL || !SUPABASE_ANON_KEY) {
      root.render(<SetupScreen />);
    } else {
      root.render(<App />);
    }
  </script>
</body>
</html>
